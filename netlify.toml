# Konfiguracja Netlify — etap M0 (szkielet backendu/CRM).
# Strona pozostaje statyczna: publikujemy katalog główny repo, bez build stepu.

[build]
  publish = "."

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

# Przyjazne API pod /api/* — przepisywane na funkcje Netlify (status 200, bez przekierowania).
# Reguła musi zostać przed ewentualnymi regułami catch-all dodanymi w przyszłości.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# publish = "." oznacza, że WSZYSTKO z korzenia repo trafia na serwer.
# Materiały wewnętrzne (dokumenty klienta, plan wdrożenia, kod funkcji)
# nie mogą być publicznie pobieralne — zwracamy 404.
[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true
